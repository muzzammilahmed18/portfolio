<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muzzammil Ahmed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 40px;
        }
        h1 {
            font-size: 48px;
            color: #64d8ff;
        }
        p {
            font-size: 18px;
            color: #aaa;
            margin-top: 10px;
        }
        .badge {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 20px;
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 20px;
            font-size: 14px;
            color: #666;
        }
        .status {
            margin-top: 30px;
            font-size: 14px;
            color: #22a65e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Muzzammil Ahmed</h1>
        <p>Backend AI Engineering Intern @ FlyRank</p>
        <div class="badge">🚧 Portfolio under construction</div>
        <div class="status">✅ Live on the web</div>
    </div>
</body>
</html>
